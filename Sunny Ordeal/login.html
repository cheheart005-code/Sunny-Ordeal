<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Sunny's Ordeal</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>

        <h1>Sunny's Ordeal</h1>

    </header>

    <main>
        <h2>Login</h2>

        <form id="loginForm">
            <label for="username">Username:</label>

            <input type="text" id="username" name="username" placeholder="Enter your username here">

            <small id="usernameError" class="error-message"></small>

            <br><br>

            <label for="password">Password:</label>

            <input type="password" id="password" name="password" placeholder="Enter your password">

            <small id="passwordError" class="error-message"></small>

            <br><br>

            <button type="submit">Login</button>

        </form>

        <p>
            Don't have an account?
            <a href="register.html">Register</a>
        </p>

        <p>
            <a href="index.html">Go to Homepage</a>
        </p>

    </main>


    <footer>

        &copy; 2026 Sunny's Ordeal. All Rights Reserved.

    </footer>

    <script src="script.js"></script>

</body>

</html>
