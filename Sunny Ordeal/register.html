<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Sunny's Ordeal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Sunny's Ordeal</h1>

    </header>

    <main>
        <h2>Create an Account</h2>

        <form id="registrationForm">

            <label for="fullname">
                Full Name:
            </label>

            <input type="text" id="fullname" name="fullname" placeholder="Enter your full name">

            <small id="fullnameError" class="error-message"></small>


            <label for="username">
                Username:
            </label>

            <input type="text" id="username" name="username" placeholder="Enter your username">

            <small id="usernameError" class="error-message"></small>


            <label for="email">
                Email:
            </label>

            <input type="email" id="email" name="email" placeholder="Enter your email">

            <small id="emailError" class="error-message"></small>


            <label for="password">
                Password:
            </label>

            <input type="password" id="password" name="password" placeholder="Enter your password">

            <small id="passwordError" class="error-message"></small>


            <label for="confirm-password">
                Confirm Password:
            </label>

            <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirm your password">

            <small id="confirmPasswordError" class="error-message"></small>

            <div class="buttons">

                <input type="submit" value="Register">

                <input type="reset" value="Clear">

            </div>

        </form>

        <p>
            Already have an account?
            <a href="login.html">Login</a>
        </p>

        <p>
            <a href="index.html">Go to Homepage</a>
        </p>

    </main>

    <footer>

        &copy; 2026 Sunny's Ordeal.
        All Rights Reserved.

    </footer>

    <script src="script.js"></script>

</body>


</html>
